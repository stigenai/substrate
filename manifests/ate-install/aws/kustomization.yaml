apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# stigenai aws profile: a k0s cluster on AWS. It builds on the k0s layout
# (kubelet root /var/lib/k0s/kubelet, the fleet's OTLP collector, no
# pod-certificate-controller.yaml) and changes the storage side:
# - Snapshots go to a real S3 bucket. atelet and ate-api-server get AWS
#   credentials from IRSA, so there is no static key and no in-cluster rustfs.
# - Nothing refers to GKE: no gs:// URL, no /home/kubernetes/bin hostPath and
#   no GCP registry auth.
# - The runsc tarballs come from a bucket you own. Copy them there with
#   hack/aws/mirror-runsc.sh.
# - Control plane images are pinned by digest. See hack/aws/pin-images.sh.
#
# Placeholders that the installer replaces with envsubst, as for
# ${SUBSTRATE_VERSION}:
#   AWS_REGION               region of the snapshot bucket
#   ATE_API_ROLE_ARN         IAM role for the ate-api-server service account
#   ATE_ATELET_ROLE_ARN      IAM role for the atelet service account
#   GVISOR_MIRROR_S3_URI     s3://BUCKET/PREFIX that holds the runsc tarballs
resources:
  - ../ate-api-server.yaml
  - ../ate-controller.yaml
  - ./atelet
  - ../atenet-router.yaml
  - ../k0s/ate-otel-config.yaml
  - ./sandboxconfig-gvisor.yaml

components:
  - ./images

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ate-api-server
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: ate-api-server
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              - name: AWS_REGION
                value: ${AWS_REGION}
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: ate-api-server
        namespace: ate-system
        annotations:
          eks.amazonaws.com/role-arn: ${ATE_API_ROLE_ARN}
