# The gVisor SandboxConfig with the runsc tarballs on your own S3 bucket.
# atelet opens the s3:// URL with its IRSA credentials. Keep the release and the
# hashes the same as in ../sandboxconfig-gvisor.yaml and hack/aws/mirror-runsc.sh.
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: gvisor-default
spec:
  sandboxClass: gvisor
  pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
  assets:
    amd64:
      gvisor:
        url: "${GVISOR_MIRROR_S3_URI}/2026-09-02/x86_64/gvisor.tar.zstd"
        sha256: "d547d81401461fd1c679c5c4fa0a6c2b8ef7dc3c22ce23c9e25dcc4c69cfd06f"
    arm64:
      gvisor:
        url: "${GVISOR_MIRROR_S3_URI}/2026-09-02/aarch64/gvisor.tar.zstd"
        sha256: "a64916f9813ce7e4841a30480a599337f7dda07b421c6bf0123db2212aa7d1df"
