# stigenai k0s profile: the fleet already runs an OTLP collector
# (monitoring/otel-collector, fan-out to Tempo/Prometheus/Loki), so control
# plane telemetry goes there instead of to a bundled collector.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc:4317
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_METRIC_EXPORT_TIMEOUT: "10000"
  OTEL_LOGS_EXPORTER: otlp
