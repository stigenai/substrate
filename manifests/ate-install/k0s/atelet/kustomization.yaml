apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../atelet.yaml

# k0s keeps the kubelet under /var/lib/k0s/kubelet, so the CSI and device
# plugin sockets live there (the container-side mount paths are unchanged).
# There is no GKE kubelet image credential provider on the node, so its host
# mounts go, as in ../../kind/atelet; registry-auth replaces it.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: atelet-${SUBSTRATE_VERSION_SUFFIX}
        namespace: ate-system
      spec:
        template:
          spec:
            containers:
            - name: atelet
              env:
              - name: ATE_STORAGE_BACKEND
                value: s3
              - name: AWS_REGION
                value: us-east-1
              - name: AWS_ENDPOINT_URL
                value: http://rustfs.ate-system.svc:9000
              - name: AWS_S3_USE_PATH_STYLE
                value: "true"
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef: {name: ate-s3-credentials, key: AWS_ACCESS_KEY_ID}
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef: {name: ate-s3-credentials, key: AWS_SECRET_ACCESS_KEY}
              - name: DOCKER_CONFIG
                value: /run/registry-auth
              volumeMounts:
              - name: registry-auth
                mountPath: /run/registry-auth
                readOnly: true
              - mountPath: /run/image-credential-provider/bin
                $patch: delete
              - mountPath: /run/image-credential-provider/config.yaml
                $patch: delete
            volumes:
            # Private actor images: atelet reads $DOCKER_CONFIG/config.json
            # for any non-GCP registry. Optional, so a cluster without the
            # Secret still pulls public images anonymously.
            - name: registry-auth
              secret:
                secretName: ate-registry-auth
                optional: true
                items:
                - key: .dockerconfigjson
                  path: config.json
            - name: image-credential-provider-bin
              $patch: delete
            - name: image-credential-provider-config
              $patch: delete
            - name: kubelet-plugins
              hostPath:
                path: /var/lib/k0s/kubelet/plugins
            - name: device-plugins
              hostPath:
                path: /var/lib/k0s/kubelet/device-plugins
